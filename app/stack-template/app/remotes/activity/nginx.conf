# Remote `activity` static — port cố định 4002 trong container (conventions/05, gateway /remotes/activity/)
server {
  listen 4002;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers baseline — CSP cho MF để SF-7 thiết kế (script-src origin shell)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # remoteEntry.js — shell fetch mỗi lần boot; KHÔNG cache aggressive (deploy mới phải thấy ngay)
  location = /remoteEntry.js {
    add_header Cache-Control "no-cache";
  }

  # Static asset — contenthash nên cache được lâu
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Standalone :4002 (BUG-1 sf-5b): index.html + runtime chunk fetch dùng publicPath
  # gateway-shaped (/remotes/activity/main.*.js — compile-time, cần cho in-shell qua
  # gateway) → map prefix đó về root để cùng 1 dist phục vụ cả 2 đường, không đổi publicPath.
  location /remotes/activity/ {
    alias /usr/share/nginx/html/;
  }

  # Standalone debug index (index.html) — không router nên fallback đơn giản
  location / {
    try_files $uri $uri/ /index.html;
  }
}
