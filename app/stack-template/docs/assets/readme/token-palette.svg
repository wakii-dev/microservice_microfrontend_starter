<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="120" viewBox="0 0 960 120" role="img" aria-label="Design token palette — six swatches for accent, ink, line, done, doing and fail tokens blinking in sequence">
  <title>Token palette — var(--accent) · var(--ink) · var(--line) · var(--st-done) · var(--st-doing) · var(--st-fail)</title>
  <desc>Six rounded color swatches blink in sequence, each ringed by a matching highlight; labels show the CSS variable name and hex value of every token.</desc>
  <defs><linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101319"/><stop offset="1" stop-color="#171b25"/></linearGradient>
    <clipPath id="palClip"><rect x="1.5" y="1.5" width="957" height="117" rx="14"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="957" height="117" rx="14" fill="url(#bgD)" stroke="#2a3040" stroke-width="1.5"/>

  <!-- accent -->
  <g clip-path="url(#palClip)">
    <rect x="20" y="16" width="140" height="58" rx="10" fill="#1677ff">
      <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.08;0.25" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="16" width="140" height="58" rx="10" fill="none" stroke="#1677ff" stroke-width="2">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.08;0.25" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="90" y="94" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#e8eaf0">var(--accent)</text>
  <text x="90" y="110" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa4b8">#1677ff</text>

  <!-- ink -->
  <g clip-path="url(#palClip)">
    <rect x="176" y="16" width="140" height="58" rx="10" fill="#0f1011">
      <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.08;0.25" dur="6s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="176" y="16" width="140" height="58" rx="10" fill="none" stroke="#0f1011" stroke-width="2">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.08;0.25" dur="6s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="246" y="94" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#e8eaf0">var(--ink)</text>
  <text x="246" y="110" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa4b8">#0f1011</text>

  <!-- line -->
  <g clip-path="url(#palClip)">
    <rect x="332" y="16" width="140" height="58" rx="10" fill="#e2e5ea">
      <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.08;0.25" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="332" y="16" width="140" height="58" rx="10" fill="none" stroke="#8a92a6" stroke-width="2">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.08;0.25" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="402" y="94" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#e8eaf0">var(--line)</text>
  <text x="402" y="110" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa4b8">#e2e5ea</text>

  <!-- st-done -->
  <g clip-path="url(#palClip)">
    <rect x="488" y="16" width="140" height="58" rx="10" fill="#52c41a">
      <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.08;0.25" dur="6s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="488" y="16" width="140" height="58" rx="10" fill="none" stroke="#52c41a" stroke-width="2">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.08;0.25" dur="6s" begin="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="558" y="94" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#e8eaf0">var(--st-done)</text>
  <text x="558" y="110" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa4b8">#52c41a</text>

  <!-- st-doing -->
  <g clip-path="url(#palClip)">
    <rect x="644" y="16" width="140" height="58" rx="10" fill="#faad14">
      <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.08;0.25" dur="6s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="644" y="16" width="140" height="58" rx="10" fill="none" stroke="#faad14" stroke-width="2">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.08;0.25" dur="6s" begin="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="714" y="94" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#e8eaf0">var(--st-doing)</text>
  <text x="714" y="110" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa4b8">#faad14</text>

  <!-- st-fail -->
  <g clip-path="url(#palClip)">
    <rect x="800" y="16" width="140" height="58" rx="10" fill="#ff4d4f">
      <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.08;0.25" dur="6s" begin="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="16" width="140" height="58" rx="10" fill="none" stroke="#ff4d4f" stroke-width="2">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.08;0.25" dur="6s" begin="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="870" y="94" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#e8eaf0">var(--st-fail)</text>
  <text x="870" y="110" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa4b8">#ff4d4f</text>
</svg>
