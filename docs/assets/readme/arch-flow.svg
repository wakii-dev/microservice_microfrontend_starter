<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Architecture diagram — browser to gateway :8080, four services lighting up in sequence, postgres pulsing, kafka topic ring with packets streaming into the activity feed">
  <title>Under the hood — browser → gateway → services → postgres + kafka → activity feed</title>
  <desc>Animated architecture: the browser calls the nginx gateway whose ring pulses; dashed wires fan out to node, spring, go and auth services lighting up in turn; postgres pulses as services persist; kafka spins its topic ring while colored packet dots stream along a curve into a live activity feed panel — looping forever.</desc>
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101319"/><stop offset="1" stop-color="#171b25"/>
    </linearGradient>
    <radialGradient id="gwGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1677ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1677ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#202839" stroke-width="1"/>
    </pattern>
    <clipPath id="archClip"><rect x="1.5" y="1.5" width="957" height="357" rx="18"/></clipPath>
    <path id="pkFlow" d="M736 258 C 768 242, 782 272, 806 262" fill="none" stroke="none"/>
  </defs>

  <rect x="1.5" y="1.5" width="957" height="357" rx="18" fill="url(#bgD)" stroke="#2a3040" stroke-width="1.5"/>
  <g clip-path="url(#archClip)">
    <rect x="1.5" y="1.5" width="957" height="357" fill="url(#grid)" opacity="0.5"/>
  </g>

  <!-- browser -->
  <g>
    <rect x="36" y="210" width="124" height="76" rx="12" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
    <text x="98" y="242" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e8eaf0">Browser</text>
    <text x="98" y="262" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#9aa4b8">shell :3000 · remotes</text>
  </g>
  <line x1="160" y1="248" x2="220" y2="248" stroke="#4096ff" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="2.8s" repeatCount="indefinite"/>
  </line>

  <!-- gateway + pulse rings -->
  <g clip-path="url(#archClip)">
    <ellipse cx="288" cy="248" rx="110" ry="80" fill="url(#gwGlow)"/>
  </g>
  <g fill="none" stroke="#1677ff" stroke-width="1.5">
    <rect x="276" y="236" width="24" height="24" rx="8" opacity="0.55">
      <animate attributeName="x" values="276;244" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="236;204" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="width" values="24;88" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="24;88" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="276" y="236" width="24" height="24" rx="8" opacity="0.55">
      <animate attributeName="x" values="276;244" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="236;204" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="24;88" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="24;88" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="220" y="204" width="136" height="88" rx="14" fill="#171b25" stroke="#4096ff" stroke-width="1.5"/>
  <text x="288" y="238" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e8eaf0">gateway</text>
  <rect x="258" y="250" width="60" height="20" rx="10" fill="#1677ff" fill-opacity="0.16" stroke="#1677ff" stroke-width="1"/>
  <text x="288" y="264" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#4096ff">:8080</text>

  <!-- fan-out gateway → services -->
  <g stroke="#4096ff" stroke-opacity="0.32" stroke-width="1.4" fill="none" stroke-dasharray="4 6">
    <line x1="356" y1="248" x2="420" y2="52"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2.4s" begin="0s" repeatCount="indefinite"/></line>
    <line x1="356" y1="248" x2="420" y2="124"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/></line>
    <line x1="356" y1="248" x2="420" y2="196"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></line>
    <line x1="356" y1="248" x2="420" y2="268"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/></line>
  </g>

  <!-- services — sáng lần lượt trong chu kỳ 8s: node → spring → go → auth -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">
    <rect x="420" y="28" width="172" height="48" rx="10" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
    <rect x="420" y="28" width="172" height="48" rx="10" fill="#1677ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.18;0;0" keyTimes="0;0.03;0.14;0.25;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="506" y="57" text-anchor="middle"><tspan fill="#e8eaf0" font-weight="600">node-svc</tspan><tspan fill="#4096ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11"> · :3001</tspan></text>

    <rect x="420" y="100" width="172" height="48" rx="10" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
    <rect x="420" y="100" width="172" height="48" rx="10" fill="#1677ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.18;0;0" keyTimes="0;0.03;0.14;0.25;1" dur="8s" begin="-6s" repeatCount="indefinite"/>
    </rect>
    <text x="506" y="129" text-anchor="middle"><tspan fill="#e8eaf0" font-weight="600">spring-svc</tspan><tspan fill="#4096ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11"> · :8081</tspan></text>

    <rect x="420" y="172" width="172" height="48" rx="10" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
    <rect x="420" y="172" width="172" height="48" rx="10" fill="#1677ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.18;0;0" keyTimes="0;0.03;0.14;0.25;1" dur="8s" begin="-4s" repeatCount="indefinite"/>
    </rect>
    <text x="506" y="201" text-anchor="middle"><tspan fill="#e8eaf0" font-weight="600">go-svc</tspan><tspan fill="#4096ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11"> · :8082</tspan></text>

    <rect x="420" y="244" width="172" height="48" rx="10" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
    <rect x="420" y="244" width="172" height="48" rx="10" fill="#1677ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.18;0;0" keyTimes="0;0.03;0.14;0.25;1" dur="8s" begin="-2s" repeatCount="indefinite"/>
    </rect>
    <text x="506" y="273" text-anchor="middle"><tspan fill="#e8eaf0" font-weight="600">auth-svc</tspan><tspan fill="#4096ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11"> · :8090</tspan></text>
  </g>

  <!-- services → postgres (persist) -->
  <g stroke="#9aa4b8" stroke-opacity="0.28" stroke-width="1.2" fill="none" stroke-dasharray="3 6">
    <line x1="592" y1="52" x2="654" y2="86"><animate attributeName="stroke-dashoffset" values="0;-36" dur="3.4s" begin="-0.4s" repeatCount="indefinite"/></line>
    <line x1="592" y1="124" x2="654" y2="92"><animate attributeName="stroke-dashoffset" values="0;-36" dur="3.4s" begin="-1.2s" repeatCount="indefinite"/></line>
    <line x1="592" y1="196" x2="654" y2="102"><animate attributeName="stroke-dashoffset" values="0;-36" dur="3.4s" begin="-2s" repeatCount="indefinite"/></line>
    <line x1="592" y1="268" x2="654" y2="112"><animate attributeName="stroke-dashoffset" values="0;-36" dur="3.4s" begin="-2.8s" repeatCount="indefinite"/></line>
  </g>

  <!-- postgres cylinder + pulse -->
  <g>
    <path d="M654 64 v56 a48 14 0 0 0 96 0 v-56" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
    <path d="M654 64 v56 a48 14 0 0 0 96 0 v-56" fill="#1677ff" opacity="0">
      <animate attributeName="opacity" values="0;0.12;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="702" cy="64" rx="48" ry="14" fill="#1d2637" stroke="#2a3040" stroke-width="1.5"/>
    <text x="702" y="158" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e8eaf0">postgres</text>
    <text x="702" y="174" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa4b8">:5432 · schema-per-svc</text>
  </g>

  <!-- go-svc → kafka (activity producer) -->
  <line x1="592" y1="208" x2="676" y2="254" stroke="#4096ff" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.2s" repeatCount="indefinite"/>
  </line>

  <!-- kafka + rotating topic ring -->
  <circle cx="706" cy="258" r="28" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 706 258" to="360 706 258" dur="9s" repeatCount="indefinite"/>
    <circle cx="706" cy="258" r="20" fill="none" stroke="#faad14" stroke-width="1.6" stroke-dasharray="4 5"/>
  </g>
  <circle cx="706" cy="258" r="4.5" fill="#faad14">
    <animate attributeName="opacity" values="1;0.45;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="706" y="306" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e8eaf0">kafka :9092</text>
  <text x="706" y="322" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#9aa4b8">task-events</text>

  <!-- packets: kafka → activity feed (đường cong, loop vô hạn) -->
  <g>
    <g>
      <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#pkFlow" href="#pkFlow"/></animateMotion>
      <circle r="7" fill="#4096ff" opacity="0.25"/><circle r="3" fill="#4096ff"/>
    </g>
    <g>
      <animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"><mpath xlink:href="#pkFlow" href="#pkFlow"/></animateMotion>
      <circle r="7" fill="#52c41a" opacity="0.25"/><circle r="3" fill="#52c41a"/>
    </g>
    <g>
      <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"><mpath xlink:href="#pkFlow" href="#pkFlow"/></animateMotion>
      <circle r="7" fill="#faad14" opacity="0.25"/><circle r="3" fill="#faad14"/>
    </g>
  </g>

  <!-- activity feed panel -->
  <g>
    <rect x="806" y="196" width="138" height="124" rx="12" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
    <circle cx="822" cy="214" r="3.5" fill="#52c41a"/>
    <circle cx="822" cy="214" r="3.5" fill="none" stroke="#52c41a" stroke-width="1.5">
      <animate attributeName="r" values="3.5;10" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="834" y="218" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8eaf0">activity feed</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10">
      <circle cx="822" cy="238" r="2.5" fill="#4096ff"/>
      <text x="832" y="242" fill="#c9d2e4">task.created</text>
      <circle cx="822" cy="262" r="2.5" fill="#52c41a"/>
      <text x="832" y="266" fill="#c9d2e4">task.assigned</text>
      <circle cx="822" cy="286" r="2.5" fill="#ff4d4f"/>
      <text x="832" y="290" fill="#c9d2e4">assignment_failed</text>
    </g>
  </g>

  <text x="24" y="344" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9aa4b8">tạo 1 task → gateway → service → kafka → activity feed · ~1s roundtrip · saga fail → DLQ</text>
</svg>
