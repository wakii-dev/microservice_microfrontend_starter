<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Component constellation — fourteen nodes such as Button, Table, Chart and Carousel linked by animated dashed data-flow lines">
  <title>Component constellation — data flowing between 14 component groups</title>
  <desc>Fourteen circular component nodes are connected by dashed lines whose dash offset continuously animates like flowing data; glowing packets travel along three edges and four nodes emit colored pulse rings.</desc>
  <defs><linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101319"/><stop offset="1" stop-color="#171b25"/></linearGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1677ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1677ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4096ff"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#262e40"/>
    </pattern>
    <clipPath id="constClip"><rect x="1.5" y="1.5" width="957" height="257" rx="14"/></clipPath>
    <path id="pk1" d="M180 128 L478 148" fill="none" stroke="none"/>
    <path id="pk2" d="M478 148 L728 126" fill="none" stroke="none"/>
    <path id="pk3" d="M728 126 L820 56" fill="none" stroke="none"/>
  </defs>

  <rect x="1.5" y="1.5" width="957" height="257" rx="14" fill="url(#bgD)" stroke="#2a3040" stroke-width="1.5"/>
  <g clip-path="url(#constClip)">
    <rect x="1.5" y="1.5" width="957" height="257" fill="url(#dotgrid)" opacity="0.6"/>
    <ellipse cx="180" cy="128" rx="150" ry="110" fill="url(#hubGlow)"/>
  </g>

  <!-- edges: dashed lines with running dash-offset (data flow) -->
  <g stroke="#1677ff" stroke-opacity="0.28" stroke-width="1.6" fill="none" stroke-dasharray="5 7">
    <line x1="180" y1="128" x2="88" y2="62"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="0s" repeatCount="indefinite"/></line>
    <line x1="236" y1="50" x2="88" y2="62"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-0.3s" repeatCount="indefinite"/></line>
    <line x1="368" y1="84" x2="236" y2="50"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-0.6s" repeatCount="indefinite"/></line>
    <line x1="110" y1="190" x2="88" y2="62"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-0.9s" repeatCount="indefinite"/></line>
    <line x1="180" y1="128" x2="478" y2="148"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-1.2s" repeatCount="indefinite"/></line>
    <line x1="330" y1="198" x2="540" y2="224"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-1.5s" repeatCount="indefinite"/></line>
    <line x1="478" y1="148" x2="624" y2="62"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-1.8s" repeatCount="indefinite"/></line>
    <line x1="478" y1="148" x2="728" y2="126"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-2.1s" repeatCount="indefinite"/></line>
    <line x1="728" y1="126" x2="848" y2="166"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-2.4s" repeatCount="indefinite"/></line>
    <line x1="820" y1="56" x2="908" y2="102"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" begin="-2.7s" repeatCount="indefinite"/></line>
    <line x1="180" y1="128" x2="236" y2="50"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-0.36s" repeatCount="indefinite"/></line>
    <line x1="180" y1="128" x2="368" y2="84"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-0.72s" repeatCount="indefinite"/></line>
    <line x1="180" y1="128" x2="330" y2="198"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-1.08s" repeatCount="indefinite"/></line>
    <line x1="330" y1="198" x2="110" y2="190"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-1.44s" repeatCount="indefinite"/></line>
    <line x1="368" y1="84" x2="478" y2="148"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/></line>
    <line x1="478" y1="148" x2="540" y2="224"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-2.16s" repeatCount="indefinite"/></line>
    <line x1="624" y1="62" x2="728" y2="126"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-2.52s" repeatCount="indefinite"/></line>
    <line x1="728" y1="126" x2="820" y2="56"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-2.88s" repeatCount="indefinite"/></line>
    <line x1="848" y1="166" x2="908" y2="102"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-3.24s" repeatCount="indefinite"/></line>
    <line x1="478" y1="148" x2="648" y2="200"><animate attributeName="stroke-dashoffset" values="0;48" dur="3.6s" begin="-3.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- data packets travelling along edges -->
  <g>
    <g>
      <animateMotion dur="2.6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#pk1" href="#pk1"/></animateMotion>
      <circle r="7" fill="#4096ff" opacity="0.25"/>
      <circle r="3.2" fill="#4096ff"/>
    </g>
    <g>
      <animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath xlink:href="#pk2" href="#pk2"/></animateMotion>
      <circle r="7" fill="#52c41a" opacity="0.25"/>
      <circle r="3.2" fill="#52c41a"/>
    </g>
    <g>
      <animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite"><mpath xlink:href="#pk3" href="#pk3"/></animateMotion>
      <circle r="7" fill="#faad14" opacity="0.25"/>
      <circle r="3.2" fill="#faad14"/>
    </g>
  </g>

  <!-- pulse rings on active nodes -->
  <g fill="none" stroke-width="2">
    <circle cx="478" cy="148" stroke="#1677ff">
      <animate attributeName="r" values="22;40" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="728" cy="126" stroke="#52c41a">
      <animate attributeName="r" values="18;34" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="198" stroke="#faad14">
      <animate attributeName="r" values="18;34" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="624" cy="62" stroke="#ff4d4f">
      <animate attributeName="r" values="17;33" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g stroke-width="2">
    <circle cx="88" cy="62" r="12" fill="#232b3d" stroke="#5e6ad2"/>
    <circle cx="236" cy="50" r="14" fill="#1b2231" stroke="#1677ff"/>
    <circle cx="368" cy="84" r="18" fill="#1b2231" stroke="#1677ff"/>
    <circle cx="330" cy="198" r="16" fill="#232b3d" stroke="#5e6ad2"/>
    <circle cx="478" cy="148" r="20" fill="url(#hub)" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="540" cy="224" r="13" fill="#1b2231" stroke="#1677ff"/>
    <circle cx="624" cy="62" r="15" fill="#1b2231" stroke="#1677ff"/>
    <circle cx="728" cy="126" r="16" fill="#1b2231" stroke="#1677ff"/>
    <circle cx="648" cy="200" r="12" fill="#232b3d" stroke="#5e6ad2"/>
    <circle cx="820" cy="56" r="12" fill="#1b2231" stroke="#1677ff"/>
    <circle cx="848" cy="166" r="14" fill="#232b3d" stroke="#5e6ad2"/>
    <circle cx="908" cy="102" r="11" fill="#232b3d" stroke="#5e6ad2"/>
    <circle cx="110" cy="190" r="13" fill="#1b2231" stroke="#1677ff"/>
    <circle cx="180" cy="128" r="24" fill="url(#hub)" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- status mini-dots -->
  <g stroke="#101319" stroke-width="1.5">
    <circle cx="381" cy="71" r="3.5" fill="#52c41a"/>
    <circle cx="551" cy="213" r="3.5" fill="#faad14"/>
    <circle cx="344" cy="184" r="3.5" fill="#ff4d4f"/>
  </g>

  <!-- labels -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d2e4" text-anchor="middle">
    <text x="180" y="132" fill="#ffffff" font-size="12.5">Button</text>
    <text x="88" y="92">Input</text>
    <text x="236" y="26">Form</text>
    <text x="368" y="118">Table</text>
    <text x="330" y="230">Modal</text>
    <text x="478" y="186">Chart</text>
    <text x="540" y="251">Select</text>
    <text x="624" y="34">Carousel</text>
    <text x="728" y="158">Tabs</text>
    <text x="648" y="228">Picker</text>
    <text x="820" y="32">Overlay</text>
    <text x="848" y="196">Navigation</text>
    <text x="908" y="129">Grid</text>
    <text x="110" y="219">Layout</text>
  </g>
</svg>
