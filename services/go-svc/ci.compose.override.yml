# ============================================================================
# CI compose override — CHỈ dùng bởi .github/workflows/services-go-svc.yml:
#   docker compose -f platform/docker-compose.yml \
#                  -f services/go-svc/ci.compose.override.yml up -d ...
#
# TẠI SAO (plan rev 2 P0-2 / plan-critic): compose pre-seed của SF-1 inject
# DATABASE_URL = postgres://${POSTGRES_USER}:${GO_SVC_DB_PASSWORD}@... —
# username superuser + password per-role → auth fail chắc chắn; readonly URL
# không bao giờ là go_readonly. SF-4 KHÔNG tự sửa compose (boundary "đụng=flag")
# → FLAG đã post (REQUIREMENT-GAP trên epic FI-62). Override file này là
# biện pháp tạm của SF-4 cho CI riêng; bỏ đi khi SF-1 fix compose gốc.
# ============================================================================
services:
  go-svc:
    environment:
      DATABASE_URL: postgres://go_svc:${GO_SVC_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_READONLY_URL: postgres://go_readonly:${GO_READONLY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
