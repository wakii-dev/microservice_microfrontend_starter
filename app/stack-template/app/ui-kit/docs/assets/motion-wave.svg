<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="180" viewBox="0 0 960 180" role="img" aria-label="Motion curves — three easing paths for enter, exit and toggle self-drawing in a loop with a dot travelling along each curve">
  <title>Motion — enter · exit · toggle easing curves</title>
  <desc>Three panels each draw an easing curve by animating stroke dash offset in a continuous loop while a colored dot travels along the path: ease-out enter in accent blue, ease-in exit in red, damped-spring toggle in green.</desc>
  <defs>
    <clipPath id="waveClip"><rect x="1.5" y="1.5" width="957" height="177" rx="14"/></clipPath>
    <path id="curveEnter" d="M60 118 C100 44 168 40 276 50" pathLength="1" fill="none" stroke="none"/>
    <path id="curveExit" d="M372 50 C456 56 520 90 590 116" pathLength="1" fill="none" stroke="none"/>
    <path id="curveToggle" d="M684 118 C718 42 762 40 794 76 C814 98 836 94 854 74 C866 60 886 56 900 58" pathLength="1" fill="none" stroke="none"/>
  </defs>

  <rect x="1.5" y="1.5" width="957" height="177" rx="14" fill="#f5f5f5" stroke="#dfe3ec" stroke-width="1.5"/>

  <!-- panel 1 · enter -->
  <g clip-path="url(#waveClip)">
    <rect x="24" y="28" width="288" height="124" rx="10" fill="#ffffff" stroke="#dfe3ec"/>
    <path d="M54 46 L54 118 L282 118" fill="none" stroke="#e6eaf2" stroke-width="1.2"/>
    <g stroke="#eef1f7" stroke-width="1" stroke-dasharray="2 6">
      <line x1="54" y1="64" x2="282" y2="64"/>
      <line x1="54" y1="82" x2="282" y2="82"/>
      <line x1="54" y1="100" x2="282" y2="100"/>
    </g>
    <use href="#curveEnter" xlink:href="#curveEnter" stroke="#1677ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;-1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </use>
    <g>
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear">
        <mpath xlink:href="#curveEnter" href="#curveEnter"/>
      </animateMotion>
      <circle r="5" fill="#1677ff" stroke="#ffffff" stroke-width="1.5">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.46;0.54;1" dur="6s" begin="0s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <circle cx="64" cy="137" r="4" fill="#1677ff"/>
  <text x="76" y="141" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#3f4551">enter · ease-out</text>

  <!-- panel 2 · exit -->
  <g clip-path="url(#waveClip)">
    <rect x="336" y="28" width="288" height="124" rx="10" fill="#ffffff" stroke="#dfe3ec"/>
    <path d="M366 46 L366 118 L594 118" fill="none" stroke="#e6eaf2" stroke-width="1.2"/>
    <g stroke="#eef1f7" stroke-width="1" stroke-dasharray="2 6">
      <line x1="366" y1="64" x2="594" y2="64"/>
      <line x1="366" y1="82" x2="594" y2="82"/>
      <line x1="366" y1="100" x2="594" y2="100"/>
    </g>
    <use href="#curveExit" xlink:href="#curveExit" stroke="#ff4d4f" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;-1" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </use>
    <g>
      <animateMotion dur="6s" begin="-2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear">
        <mpath xlink:href="#curveExit" href="#curveExit"/>
      </animateMotion>
      <circle r="5" fill="#ff4d4f" stroke="#ffffff" stroke-width="1.5">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.46;0.54;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <circle cx="376" cy="137" r="4" fill="#ff4d4f"/>
  <text x="388" y="141" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#3f4551">exit · ease-in</text>

  <!-- panel 3 · toggle -->
  <g clip-path="url(#waveClip)">
    <rect x="648" y="28" width="288" height="124" rx="10" fill="#ffffff" stroke="#dfe3ec"/>
    <path d="M678 46 L678 118 L906 118" fill="none" stroke="#e6eaf2" stroke-width="1.2"/>
    <g stroke="#eef1f7" stroke-width="1" stroke-dasharray="2 6">
      <line x1="678" y1="64" x2="906" y2="64"/>
      <line x1="678" y1="82" x2="906" y2="82"/>
      <line x1="678" y1="100" x2="906" y2="100"/>
    </g>
    <use href="#curveToggle" xlink:href="#curveToggle" stroke="#52c41a" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;-1" dur="6s" begin="-4s" repeatCount="indefinite"/>
    </use>
    <g>
      <animateMotion dur="6s" begin="-4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear">
        <mpath xlink:href="#curveToggle" href="#curveToggle"/>
      </animateMotion>
      <circle r="5" fill="#52c41a" stroke="#ffffff" stroke-width="1.5">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.46;0.54;1" dur="6s" begin="-4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <circle cx="688" cy="137" r="4" fill="#52c41a"/>
  <text x="700" y="141" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#3f4551">toggle · spring</text>
</svg>
