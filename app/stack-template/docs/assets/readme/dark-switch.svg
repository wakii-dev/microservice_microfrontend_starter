<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="220" viewBox="0 0 480 220" role="img" aria-label="Theme switch — two app panels cross-fading between light and dark palettes while a sun and moon icon rotate and swap">
  <title>Dark mode — one attribute, two palettes</title>
  <desc>Two mini app panels fade between the light and dark token palettes in opposite phase; the sun icon rotates away as the moon fades in, driven by the data-bp-theme attribute shown below.</desc>
  <defs><linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101319"/><stop offset="1" stop-color="#171b25"/></linearGradient>
    <clipPath id="pl"><rect x="24" y="44" width="200" height="136" rx="12"/></clipPath>
    <clipPath id="pr"><rect x="256" y="44" width="200" height="136" rx="12"/></clipPath>
    <clipPath id="dsClip"><rect x="1.5" y="1.5" width="477" height="217" rx="14"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="477" height="217" rx="14" fill="url(#bgD)" stroke="#2a3040" stroke-width="1.5"/>

  <!-- left panel · light → dark → light -->
  <g clip-path="url(#pl)">
    <rect x="24" y="44" width="200" height="136" fill="#f5f5f5">
      <animate attributeName="fill" values="#f5f5f5;#0f1011;#f5f5f5" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="44" width="200" height="30" fill="#ffffff">
      <animate attributeName="fill" values="#ffffff;#17181c;#ffffff" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="60" width="200" height="14" fill="#ffffff">
      <animate attributeName="fill" values="#ffffff;#17181c;#ffffff" dur="9s" repeatCount="indefinite"/>
    </rect>
    <g>
      <circle cx="40" cy="59" r="4" fill="#ff4d4f"/>
      <circle cx="54" cy="59" r="4" fill="#faad14"/>
      <circle cx="68" cy="59" r="4" fill="#52c41a"/>
    </g>
    <!-- sun: rotates, fades out at night -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.44;0.5;0.94;1" dur="9s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 196 59" to="360 196 59" dur="18s" repeatCount="indefinite"/>
        <circle cx="196" cy="59" r="5" fill="#faad14"/>
        <g stroke="#faad14" stroke-width="1.6" stroke-linecap="round">
          <line x1="196" y1="48" x2="196" y2="52"/>
          <line x1="196" y1="66" x2="196" y2="70"/>
          <line x1="185" y1="59" x2="189" y2="59"/>
          <line x1="203" y1="59" x2="207" y2="59"/>
          <line x1="188.5" y1="51.5" x2="191.3" y2="54.3"/>
          <line x1="200.7" y1="63.7" x2="203.5" y2="66.5"/>
          <line x1="188.5" y1="66.5" x2="191.3" y2="63.7"/>
          <line x1="200.7" y1="54.3" x2="203.5" y2="51.5"/>
        </g>
      </g>
    </g>
    <!-- moon: fades in at night; overlay crescent tracks the header color -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.5;0.94;1" dur="9s" repeatCount="indefinite"/>
      <circle cx="196" cy="59" r="5.5" fill="#828fff"/>
      <circle cx="198.2" cy="57.5" r="4.8" fill="#ffffff">
        <animate attributeName="fill" values="#ffffff;#17181c;#ffffff" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="24" y="74" width="54" height="106" fill="#eceef2">
      <animate attributeName="fill" values="#eceef2;#16171b;#eceef2" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="90" width="34" height="7" rx="3.5" fill="#cdd3dd">
      <animate attributeName="fill" values="#cdd3dd;#2b2e35;#cdd3dd" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="104" width="34" height="7" rx="3.5" fill="#1677ff">
      <animate attributeName="fill" values="#1677ff;#5e6ad2;#1677ff" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="118" width="34" height="7" rx="3.5" fill="#cdd3dd">
      <animate attributeName="fill" values="#cdd3dd;#2b2e35;#cdd3dd" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="88" y="86" width="124" height="80" rx="8" fill="#ffffff">
      <animate attributeName="fill" values="#ffffff;#17181c;#ffffff" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="98" width="88" height="7" rx="3.5" fill="#d3d7de">
      <animate attributeName="fill" values="#d3d7de;#2b2e35;#d3d7de" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="112" width="64" height="7" rx="3.5" fill="#d3d7de">
      <animate attributeName="fill" values="#d3d7de;#2b2e35;#d3d7de" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="126" width="96" height="7" rx="3.5" fill="#d3d7de">
      <animate attributeName="fill" values="#d3d7de;#2b2e35;#d3d7de" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="144" width="52" height="16" rx="8" fill="#1677ff">
      <animate attributeName="fill" values="#1677ff;#5e6ad2;#1677ff" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="24" y="44" width="200" height="136" rx="12" fill="none" stroke="#e2e5ea" stroke-width="1.5">
    <animate attributeName="stroke" values="#e2e5ea;#23252a;#e2e5ea" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- right panel · dark → light → dark -->
  <g clip-path="url(#pr)">
    <rect x="256" y="44" width="200" height="136" fill="#0f1011">
      <animate attributeName="fill" values="#0f1011;#f5f5f5;#0f1011" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="256" y="44" width="200" height="30" fill="#17181c">
      <animate attributeName="fill" values="#17181c;#ffffff;#17181c" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="256" y="60" width="200" height="14" fill="#17181c">
      <animate attributeName="fill" values="#17181c;#ffffff;#17181c" dur="9s" repeatCount="indefinite"/>
    </rect>
    <g>
      <circle cx="272" cy="59" r="4" fill="#ff4d4f"/>
      <circle cx="286" cy="59" r="4" fill="#faad14"/>
      <circle cx="300" cy="59" r="4" fill="#52c41a"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.5;0.94;1" dur="9s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 428 59" to="360 428 59" dur="18s" repeatCount="indefinite"/>
        <circle cx="428" cy="59" r="5" fill="#faad14"/>
        <g stroke="#faad14" stroke-width="1.6" stroke-linecap="round">
          <line x1="428" y1="48" x2="428" y2="52"/>
          <line x1="428" y1="66" x2="428" y2="70"/>
          <line x1="417" y1="59" x2="421" y2="59"/>
          <line x1="435" y1="59" x2="439" y2="59"/>
          <line x1="420.5" y1="51.5" x2="423.3" y2="54.3"/>
          <line x1="432.7" y1="63.7" x2="435.5" y2="66.5"/>
          <line x1="420.5" y1="66.5" x2="423.3" y2="63.7"/>
          <line x1="432.7" y1="54.3" x2="435.5" y2="51.5"/>
        </g>
      </g>
    </g>
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.44;0.5;0.94;1" dur="9s" repeatCount="indefinite"/>
      <circle cx="428" cy="59" r="5.5" fill="#828fff"/>
      <circle cx="430.2" cy="57.5" r="4.8" fill="#17181c">
        <animate attributeName="fill" values="#17181c;#ffffff;#17181c" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="256" y="74" width="54" height="106" fill="#16171b">
      <animate attributeName="fill" values="#16171b;#eceef2;#16171b" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="266" y="90" width="34" height="7" rx="3.5" fill="#2b2e35">
      <animate attributeName="fill" values="#2b2e35;#cdd3dd;#2b2e35" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="266" y="104" width="34" height="7" rx="3.5" fill="#5e6ad2">
      <animate attributeName="fill" values="#5e6ad2;#1677ff;#5e6ad2" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="266" y="118" width="34" height="7" rx="3.5" fill="#2b2e35">
      <animate attributeName="fill" values="#2b2e35;#cdd3dd;#2b2e35" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="320" y="86" width="124" height="80" rx="8" fill="#17181c">
      <animate attributeName="fill" values="#17181c;#ffffff;#17181c" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="332" y="98" width="88" height="7" rx="3.5" fill="#2b2e35">
      <animate attributeName="fill" values="#2b2e35;#d3d7de;#2b2e35" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="332" y="112" width="64" height="7" rx="3.5" fill="#2b2e35">
      <animate attributeName="fill" values="#2b2e35;#d3d7de;#2b2e35" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="332" y="126" width="96" height="7" rx="3.5" fill="#2b2e35">
      <animate attributeName="fill" values="#2b2e35;#d3d7de;#2b2e35" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="332" y="144" width="52" height="16" rx="8" fill="#5e6ad2">
      <animate attributeName="fill" values="#5e6ad2;#1677ff;#5e6ad2" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="256" y="44" width="200" height="136" rx="12" fill="none" stroke="#23252a" stroke-width="1.5">
    <animate attributeName="stroke" values="#23252a;#e2e5ea;#23252a" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- swap glyph -->
  <g clip-path="url(#dsClip)">
    <g fill="#8a92a6">
      <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0;-2 0;0 0;2 0;0 0" dur="3s" repeatCount="indefinite"/>
      <path d="M234 108 l-7 4.5 7 4.5 z"/>
      <path d="M246 108 l7 4.5 -7 4.5 z"/>
    </g>
  </g>

  <text x="240" y="207" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9aa4b8">&lt;html data-bp-theme="dark"&gt;</text>
</svg>
