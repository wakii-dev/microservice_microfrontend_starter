# Shell static — port cố định 3000 trong container (conventions/05, gateway proxy_pass / → shell:3000)
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers baseline (security-audit M-1) — CSP cho MF host để SF-7 thiết kế
  # (script-src phải cho phép origin remote), ở đây chỉ 3 header không phụ thuộc origin.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # SPA fallback — react-router history API (refresh deep-link không 404)
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
