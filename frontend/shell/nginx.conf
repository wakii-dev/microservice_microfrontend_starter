# Shell static — port cố định 3000 trong container (conventions/05, gateway proxy_pass / → shell:3000)
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — react-router history API (refresh deep-link không 404)
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
