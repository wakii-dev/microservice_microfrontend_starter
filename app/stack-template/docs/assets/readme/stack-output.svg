<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="-apple-system,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101319"/>
      <stop offset="1" stop-color="#171b25"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4096ff"/>
      <stop offset="1" stop-color="#828fff"/>
    </linearGradient>
  </defs>
  <style>
    .card { fill:#1c212c; stroke:#2a3040; stroke-width:1.5; rx:10; }
    .t { fill:#e8eaf0; }
    .m { fill:#9aa4b8; }
    .g { fill:#52c41a; }
    .a { fill:#4096ff; }
    .fade { opacity:0; animation:fade .5s forwards; }
    .fade:nth-of-type(1){animation-delay:.3s}
    .f1{animation-delay:.4s}.f2{animation-delay:.9s}.f3{animation-delay:1.4s}.f4{animation-delay:1.9s}.f5{animation-delay:2.4s}.f6{animation-delay:2.9s}
    @keyframes fade{to{opacity:1}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .type{width:0;white-space:nowrap;overflow:hidden;animation:type 2.2s .3s forwards}
    @keyframes type{to{width:38ch}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .bar{transform-origin:left;animation:grow 1.4s ease-out forwards}
    .b1{animation-delay:2.8s}.b2{animation-delay:3.1s}.b3{animation-delay:3.4s}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .dot{animation:up 2.4s ease-in-out infinite}
    .d2{animation-delay:.4s}.d3{animation-delay:.8s}.d4{animation-delay:1.2s}
    @keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .hl{animation:hl 6s steps(1) infinite}
    .h2{animation-delay:2s}.h3{animation-delay:4s}
    @keyframes hl{0%,100%{fill:#1c212c}10%,90%{fill:#1f2b3d}}
  </style>

  <rect x="1.5" y="1.5" width="957" height="427" rx="18" fill="url(#bg2)" stroke="#2a3040" stroke-width="1.5"/>

  <!-- ══ Panel 1: terminal scaffold ══ -->
  <rect class="card" x="20" y="20" width="330" height="180" rx="10"/>
  <circle cx="36" cy="36" r="4" fill="#ff5f57"/><circle cx="50" cy="36" r="4" fill="#febc2e"/><circle cx="64" cy="36" r="4" fill="#28c840"/>
  <text x="80" y="40" class="m" font-size="11">zsh — scaffold</text>
  <text x="34" y="68" font-size="12" fill="#e8eaf0" font-family="ui-monospace,Menlo,monospace">
    <tspan class="a">$</tspan> <tspan class="type">npx create-wakii-stack my-stack --all</tspan><tspan class="cursor" fill="#e8eaf0">▌</tspan>
  </text>
  <g class="fade f2" font-size="11" font-family="ui-monospace,Menlo,monospace">
    <text x="40" y="96" class="g">✓ 540 files · 5 BE services · 4 FE apps</text>
    <text x="40" y="114" class="m">pruned tooling · registry deps locked</text>
    <text x="40" y="140" fill="#e8eaf0"><tspan class="a">$</tspan> docker compose up -d</text>
    <text x="40" y="158" class="g">✓ 11 containers healthy — gateway :8080</text>
  </g>

  <!-- ══ Panel 2: real output tree ══ -->
  <rect class="card" x="370" y="20" width="270" height="180" rx="10"/>
  <text x="386" y="40" class="m" font-size="11">output — my-stack/ (real)</text>
  <g font-size="10.8" font-family="ui-monospace,Menlo,monospace">
    <text class="fade f1" x="386" y="64"><tspan class="a">app/</tspan> <tspan class="m">shell·remotes·admin·shared</tspan></text>
    <text class="fade f2" x="386" y="86"><tspan class="a">services/</tspan> <tspan class="m">node·spring·go·dotnet·auth</tspan></text>
    <text class="fade f3" x="386" y="108"><tspan class="a">platform/</tspan> <tspan class="m">compose·gateway·kafka-init</tspan></text>
    <text class="fade f4" x="386" y="130"><tspan class="a">contracts/</tspan> <tspan class="m">openapi·events·db</tspan></text>
    <text class="fade f5" x="386" y="152"><tspan class="a">AGENTS.md</tspan> <tspan class="m">· WORKFLOW · generators</tspan></text>
    <text class="fade f6 g" x="386" y="174">.gitignore · lockfile (frozen ✓)</text>
  </g>

  <!-- ══ Panel 3: browser :8080 ══ -->
  <rect class="card" x="660" y="20" width="280" height="180" rx="10"/>
  <circle cx="676" cy="36" r="3.5" fill="#ff5f57"/><circle cx="688" cy="36" r="3.5" fill="#febc2e"/><circle cx="700" cy="36" r="3.5" fill="#28c840"/>
  <rect x="712" y="30" width="215" height="12" rx="6" fill="#10131a"/>
  <text x="720" y="40" class="m" font-size="9">localhost:8080 — gateway (single entry)</text>
  <rect class="fade f3" x="672" y="52" width="138" height="10" rx="5" fill="url(#accent2)"/>
  <rect class="fade f4" x="672" y="70" width="96" height="8" rx="4" fill="#2a3040"/>
  <rect class="fade f4" x="672" y="84" width="118" height="8" rx="4" fill="#2a3040"/>
  <rect class="bar b1" x="672" y="104" width="120" height="22" rx="6" fill="#1f2b3d"/>
  <rect class="bar b2" x="672" y="132" width="120" height="22" rx="6" fill="#1f2b3d"/>
  <rect class="bar b3" x="672" y="160" width="120" height="22" rx="6" fill="#1f2b3d"/>
  <text class="fade f5 m" x="808" y="118" font-size="9">kanban drag</text>
  <text class="fade f5 m" x="808" y="146" font-size="9">activity feed</text>
  <text class="fade f5 m" x="808" y="174" font-size="9">saga · DLQ</text>
  <circle class="dot pulse" cx="880" cy="60" r="4" fill="#52c41a"/>
  <circle class="dot d2 pulse" cx="895" cy="60" r="4" fill="#52c41a"/>
  <circle class="dot d3 pulse" cx="910" cy="60" r="4" fill="#52c41a"/>

  <!-- ══ Usage guide — 3 steps ══ -->
  <text x="20" y="238" class="t" font-size="15" font-weight="700">How to use — 3 steps</text>
  <g font-size="12.5" font-family="ui-monospace,Menlo,monospace">
    <rect class="hl"    x="20" y="254" width="920" height="34" rx="8"/>
    <text x="34" y="276"><tspan class="a">1</tspan>  cd my-stack <tspan class="m">&amp;&amp;</tspan> cp platform/.env.example platform/.env <tspan class="m"># fill JWT_SECRET + passwords</tspan></text>
    <rect class="hl h2" x="20" y="294" width="920" height="34" rx="8"/>
    <text x="34" y="316"><tspan class="a">2</tspan>  git init <tspan class="m">&amp;&amp;</tspan> docker compose -f platform/docker-compose.yml --env-file platform/.env up -d</text>
    <rect class="hl h3" x="20" y="334" width="920" height="34" rx="8"/>
    <text x="34" y="356"><tspan class="a">3</tspan>  open http://localhost:8080 <tspan class="m"># login alice@demo.local / demo-password</tspan></text>
  </g>

  <!-- ══ Footer chips ══ -->
  <g font-size="11">
    <rect x="20" y="384" width="150" height="26" rx="13" fill="#1f2b3d"/>
    <text x="95" y="401" class="a" text-anchor="middle">⚡ boot 96s (measured)</text>
    <rect x="182" y="384" width="170" height="26" rx="13" fill="#1f2b3d"/>
    <text x="267" y="401" class="a" text-anchor="middle">🧪 56/56 tests green out-of-box</text>
    <rect x="364" y="384" width="200" height="26" rx="13" fill="#1f2b3d"/>
    <text x="464" y="401" class="a" text-anchor="middle">🤖 AGENTS + gen:* included</text>
    <rect x="576" y="384" width="200" height="26" rx="13" fill="#1f2b3d"/>
    <text x="676" y="401" class="a" text-anchor="middle">📦 ui-kit latest, locked</text>
    <rect x="788" y="384" width="152" height="26" rx="13" fill="#1f2b3d"/>
    <text x="864" y="401" class="a" text-anchor="middle">🔁 kafka-init race-safe</text>
  </g>
  <text x="480" y="422" class="m" font-size="10" text-anchor="middle">create-wakii-stack — real output, machine-verified · AI-native 10-round audited</text>
</svg>
