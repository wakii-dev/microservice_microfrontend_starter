<!-- Manager chrome chi tiết — "Đồng bộ ui-kit". Theme API (manager.ts) lo màu
     nền/viền/mực/accent; phần dưới là những gì API không với tới, selector
     chuyên SB9 manager. Giá trị hardcode mirror styles/tokens.css (light) —
     đổi token = đổi cùng commit. -->
<style>
  :root {
    /* Local copies cho manager (bundle riêng — không có tokens.css) */
    --bp-canvas: #f5f5f5;   /* --c-canvas */
    --bp-s1: #ffffff;       /* --c-s1 */
    --bp-s3: #fafafa;       /* --c-s3 */
    --bp-ink: rgba(0, 0, 0, 0.88);
    --bp-ink2: rgba(0, 0, 0, 0.65);
    --bp-ink3: rgba(0, 0, 0, 0.45);
    --bp-line: #e2e5ea;     /* --line */
    --bp-line2: #eef0f3;    /* --line2 */
    --bp-accent: #1677ff;   /* --accent */
    --bp-r1: 6px;           /* --r-1 */
    --bp-r2: 8px;           /* --r-2 */
  }

  /* Dark — manager.ts đặt data-bp-theme trên body manager khi globals=dark.
     Giá trị mirror themes/dark.css. */
  body[data-bp-theme='dark'] {
    --bp-canvas: #010102;
    --bp-s1: #0f1011;
    --bp-s3: #18191a;
    --bp-ink: #f7f8f8;
    --bp-ink2: #d0d6e0;
    --bp-ink3: #8a8f98;
    --bp-line: #23252a;
    --bp-line2: #2b2d33;
    --bp-accent: #828fff;   /* --accent-hi — selected/hover đọc được trên tối */
  }
  body[data-bp-theme='dark'] .search-field:focus-within {
    box-shadow: 0 0 0 2px rgba(130, 143, 255, 0.15);
  }
  /* Element iframe bị emotion set nền trắng — lộ dải trắng lúc loading và
     khi nội dung ngắn hơn viewport (fix judge 2026-10-23). */
  body[data-bp-theme='dark'] #storybook-preview-iframe {
    background: #010102; /* --c-canvas dark */
  }

  /* ── Brand area ── */
  .sidebar-header img[alt='Wakii UI Kit'] { border-radius: var(--bp-r1); }

  /* ── Search field — Input affix look: nền s3, radius r-2, focus ring accent ── */
  .search-field {
    background: var(--bp-s3) !important;
    border: 1px solid var(--bp-line);
    border-radius: var(--bp-r2);
    transition: border-color 160ms;
  }
  .search-field:focus-within {
    border-color: var(--bp-accent);
    box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); /* mirror ring accent/10 */
  }

  /* ── Sidebar items — hover s3, active chữ ink + bar accent trái ── */
  [data-item-id].sidebar-item,
  button.sidebar-item {
    border-radius: var(--bp-r1);
    transition: background-color 160ms;
  }
  [data-item-id].sidebar-item:hover:not([data-selected='true']),
  button.sidebar-item:hover {
    background: var(--bp-s3);
  }
  [data-item-id].sidebar-item[data-selected='true'] {
    background: var(--bp-s3);
    color: var(--bp-ink);
    font-weight: 500;
    box-shadow: inset 2px 0 0 var(--bp-accent); /* gạch accent — mirror NavBar aria-current */
  }
  /* Group heading — meta nhã màu ink3 */
  .sidebar-subheading { color: var(--bp-ink3); font-size: 12px; letter-spacing: 0.04em; }

  /* ── Scrollbar manager — mirror fix repo: pill 8px, thumb line2, track trong suốt ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb {
    background: var(--bp-line2);
    border-radius: 9999px; /* --r-pill */
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--bp-line); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── Build badge (giữ cơ chế cũ, ăn biến local) ── */
  #build-badge {
    position: fixed; right: 10px; bottom: 8px; z-index: 99999;
    background: rgba(0, 0, 0, 0.65); color: #8fd14f;
    font: 10px/1.6 ui-monospace, monospace;
    padding: 2px 8px; border-radius: 9999px; pointer-events: none;
  }
</style>
