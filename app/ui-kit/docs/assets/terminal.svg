<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Terminal recording — pnpm add @wakii/ui-kit installs version 0.5.0, done in 1.4 seconds, with a blinking block cursor">
  <title>pnpm add @wakii/ui-kit</title>
  <desc>Mock terminal window: the install command types a blinking block cursor, output lines appear one by one — packages resolved, the package added at 0.5.0, done in 1.4s in green — then a fresh prompt waits and the loop replays.</desc>
  <defs>
    <clipPath id="termClip"><rect x="8" y="10" width="624" height="282" rx="14"/></clipPath>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e6ad2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5e6ad2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5e6ad2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3H4" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="tshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f1011" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="8" y="10" width="624" height="282" rx="14" fill="#0f1011" stroke="#23252a" stroke-width="1.5" filter="url(#tshadow)"/>
  <g clip-path="url(#termClip)">
    <rect x="8" y="10" width="624" height="40" fill="#17181c"/>
    <rect x="8" y="36" width="624" height="14" fill="#17181c"/>
    <rect x="8" y="48.5" width="624" height="1.5" fill="url(#accentLine)"/>
    <rect x="8" y="50" width="624" height="242" fill="url(#scan)"/>

    <circle cx="34" cy="30" r="5.5" fill="#ff4d4f">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="30" r="5.5" fill="#faad14">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74" cy="30" r="5.5" fill="#52c41a">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="320" y="34" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7d828c">zsh — ui-kit install</text>

    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.94;1" dur="10s" repeatCount="indefinite"/>

      <!-- command line + blinking block cursor -->
      <text x="34" y="80"><tspan fill="#52c41a">$</tspan><tspan fill="#e6e8ec"> pnpm add @wakii/ui-kit</tspan></text>
      <g>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.29;0.30;1" dur="10s" repeatCount="indefinite"/>
        <rect x="234" y="68" width="9" height="15" fill="#e6e8ec">
          <animate attributeName="opacity" values="1;0" dur="1.06s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- output lines, staggered -->
      <text x="34" y="110" fill="#8a8f98" opacity="0">Packages: +38
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.10;0.14;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="34" y="134" fill="#8a8f98" opacity="0">Progress: resolved 412, reused 398, added 38
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.24;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="34" y="158" fill="#4096ff" opacity="0">+ @wakii/ui-kit 0.5.0
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.34;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="34" y="182" fill="#52c41a" opacity="0">✓ done in 1.4s
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.46;1" dur="10s" repeatCount="indefinite"/>
      </text>

      <!-- fresh prompt + blinking cursor -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.48;1" dur="10s" repeatCount="indefinite"/>
        <text x="34" y="216"><tspan fill="#52c41a">$</tspan></text>
        <rect x="48" y="204" width="9" height="15" fill="#e6e8ec">
          <animate attributeName="opacity" values="1;0" dur="1.06s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>
      </g>

      <text x="34" y="246" fill="#575d68" font-style="italic" opacity="0"># tokens-first · dark · motion
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.62;1" dur="10s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
