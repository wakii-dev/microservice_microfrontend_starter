name: publish-uikit

# ============================================================================
# Publish @wakii/ui-kit lên npmjs.org khi push vào nhánh `release/ui-kit`
# (chỉ đạo user 2026-10-24: "workflow action publish new version cho ui-kit,
# trigger khi push vào nhánh release/ui-kit"). Chạy tay được qua workflow_dispatch.
#
# ⚠️ ĐIỀU KIỆN ĐỂ WORKFLOW NÀY CHẠY THẬT (đọc trước khi bật):
#  (a) Secret NPM_TOKEN (npm_... classic Automation — account npm wakii, quyền
#      publish scope @wakii; xem app/ui-kit/RELEASE.md bảng token đầu file)
#      phải được set trong: repo Settings → Secrets and variables → Actions →
#      New repository secret, tên đúng `NPM_TOKEN`.
#  (b) 2026-10-24: repo đang DISABLE GitHub Actions (vấn đề billing — CLAUDE.md
#      mục CI; gate thực tế đang là .husky/pre-push). Workflow này chỉ fire khi
#      Actions được bật lại — khi đó push nhánh release/ui-kit hoặc Run workflow.
#
# Pipeline: install workspace → gates (test + typecheck + build) → gọi thẳng
# scripts/publish-npm.sh với env NPM_TOKEN (script tự: rebuild dist → TMP copy
# TÁCH NGUỒN dist + src/styles → python strip devDeps/scripts/overrides +
# publishConfig registry npmjs → .npmrc TMP từ NPM_TOKEN → npm publish) →
# tag v<version> + GitHub release với notes trích từ app/ui-kit/CHANGELOG.md.
# ============================================================================
on:
  push:
    branches: [release/ui-kit]
  workflow_dispatch:

permissions:
  contents: write # tag v<version> + GitHub release; npm publish đi qua secret NPM_TOKEN (không dùng GITHUB_TOKEN)

concurrency:
  group: publish-uikit-${{ github.ref }}
  cancel-in-progress: false # publish đang chạy không bị huỷ giữa chừng

jobs:
  publish:
    name: gates (test / typecheck / build) → publish npmjs → tag + release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 9.15.9 — đồng bộ packageManager root package.json (chuẩn workflow ui-kit.yml)
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@wakii'

      - name: Install workspace (frozen lockfile — lock của cả monorepo)
        run: pnpm install --frozen-lockfile

      # Gates trước publish — fail là dừng, không publish
      - name: Gate — test (vitest)
        run: pnpm --filter @wakii/ui-kit test
      - name: Gate — typecheck (tsc --noEmit)
        run: pnpm --filter @wakii/ui-kit typecheck
      - name: Gate — build (tsup + CSS compiled)
        run: pnpm --filter @wakii/ui-kit build

      # Publish đúng quy trình script ĐÃ FIX: TMP copy tách nguồn (dist + src/styles
      # copy RIÊNG — basename trap làm mất CSS tokens) + guard src/styles tồn tại
      # → python strip devDeps/scripts/overrides + publishConfig registry → NPM_TOKEN
      # env ưu tiên (không đụng ~/.npmrc của runner) → npm publish --access public.
      - name: Publish @wakii/ui-kit lên npmjs.org
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash app/ui-kit/scripts/publish-npm.sh

      - name: Tag v<version> + GitHub release (notes trích CHANGELOG)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app/ui-kit/package.json').version")
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} đã tồn tại — coi như đã release version này, bỏ qua."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "@wakii/ui-kit ${TAG}"
          git push origin "${TAG}"
          # Notes: mục CHANGELOG khớp version (so khớp prefix LITERAL bằng index()
          # — tránh regex với dấu '.' trong version), cắt tới heading `## [` kế tiếp.
          awk -v ver="[${VERSION}]" '
            index($0, "## " ver) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' app/ui-kit/CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || printf 'Release %s của @wakii/ui-kit (CHANGELOG.md chưa có mục %s).\n' "${TAG}" "${VERSION}" > /tmp/notes.md
          gh release create "${TAG}" --title "@wakii/ui-kit ${TAG}" --notes-file /tmp/notes.md --target "${GITHUB_SHA}"
