openapi: 3.0.3
info:
  title: Users API (spring-svc)
  version: 0.1.0
  description: |
    Source of truth cho API users + teams của spring-svc (SF-3, Spring Boot 3 Web MVC).
    DB schema: `users` (Flyway migration, seed đọc `contracts/auth/users.json` — id phải khớp 100%).
    node-svc validate assignee bằng GET /users/{userId} (timeout 2s, fail-closed 503 khi spring down).
    Mọi path được gateway route qua `/api/users` (pass-through — service mount prefix này).
    Auth: JWT Bearer bắt buộc; spring-svc TỰ verify signature + expiry.
servers:
  - url: /api/users
tags:
  - name: users
  - name: teams
paths:
  /healthz:
    get:
      tags: [users]
      summary: Liveness probe (Spring actuator bridge)
      operationId: getHealthz
      responses:
        "200":
          description: Service sống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      tags: [users]
      summary: Readiness probe (Flyway migration xong + DB reachable)
      operationId: getReadyz
      responses:
        "200":
          description: Sẵn sàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Chưa sẵn sàng (migration chưa chạy xong)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users:
    get:
      tags: [users]
      summary: Liệt kê users
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Danh sách users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [users]
      summary: Tạo user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User đã tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [users]
      summary: Lấy 1 user (endpoint node-svc dùng để validate assignee)
      operationId: getUser
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [users]
      summary: Cập nhật user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User sau cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /teams:
    get:
      tags: [teams]
      summary: Liệt kê teams
      operationId: listTeams
      responses:
        "200":
          description: Danh sách teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [teams]
      summary: Tạo team
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team đã tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /teams/{teamId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [teams]
      summary: Lấy 1 team (kèm member ids)
      operationId: getTeam
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    BadRequest:
      description: Payload không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Thiếu hoặc sai JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      enum: [admin, user]
      description: Phải khớp roles trong contracts/auth/users.json
    User:
      type: object
      required: [id, email, displayName, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    CreateUserRequest:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          default: [user]
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
    Team:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberIds:
          type: array
          items:
            type: string
            format: uuid
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        memberIds:
          type: array
          items:
            type: string
            format: uuid
    TeamList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        total:
          type: integer
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      description: Error envelope chung — shape chuẩn hoá trong platform/conventions/04-error-envelope.md
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              nullable: true
            details:
              nullable: true
