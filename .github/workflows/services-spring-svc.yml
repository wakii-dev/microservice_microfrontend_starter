name: services-spring-svc

# SF-3 (FI-71) — copy từ .github/workflow-templates/services-ci.yml.example
# path-filter THÊM contracts/openapi/users.yaml (drift-guard không mù khi đổi contract)
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "services/spring-svc/**"
      - "platform/docker-compose.yml"
      - ".github/workflows/services-spring-svc.yml"
      - "contracts/openapi/users.yaml"
  pull_request:
    paths:
      - "services/spring-svc/**"
      - "platform/docker-compose.yml"
      - ".github/workflows/services-spring-svc.yml"
      - "contracts/openapi/users.yaml"

permissions:
  contents: read # least-privilege (P2 security-audit SF-7 — follow-up repo-wide)

jobs:
  build-test:
    name: build + test (mvnw verify — Postgres thật)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # ĐỦ cho platform/postgres/init/01-init.sh (set -euo pipefail) chạy trọn
          POSTGRES_USER: boilerplate
          POSTGRES_PASSWORD: change-me-postgres
          POSTGRES_DB: boilerplate
          NODE_SVC_DB_PASSWORD: change-me-node
          SPRING_SVC_DB_PASSWORD: change-me-spring
          GO_SVC_DB_PASSWORD: change-me-go
          GO_READONLY_DB_PASSWORD: change-me-goreadonly
          AUTH_SVC_DB_PASSWORD: change-me-auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boilerplate -d boilerplate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      JWT_SECRET: ci-smoke-secret-placeholder-not-real-32chars
      USERS_FIXTURE_PATH: ${{ github.workspace }}/contracts/auth/users.json
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/boilerplate
      SPRING_DATASOURCE_USERNAME: spring_svc
      SPRING_DATASOURCE_PASSWORD: change-me-spring
    steps:
      - uses: actions/checkout@v4
      - name: Apply postgres init script SF-1 (schemas + roles + search_path — nguyên văn platform/postgres/init)
        # Service container KHÔNG mount init (mount workspace trước checkout = dir root-owned
        # → checkout EACCES); chạy script sau checkout qua psql client của runner.
        env:
          PGHOST: localhost
          PGPASSWORD: change-me-postgres
          POSTGRES_USER: boilerplate
          POSTGRES_DB: boilerplate
          NODE_SVC_DB_PASSWORD: change-me-node
          SPRING_SVC_DB_PASSWORD: change-me-spring
          GO_SVC_DB_PASSWORD: change-me-go
          GO_READONLY_DB_PASSWORD: change-me-goreadonly
          AUTH_SVC_DB_PASSWORD: change-me-auth
          DOTNET_SVC_DB_PASSWORD: change-me-dotnet
        run: bash platform/postgres/init/01-init.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: mvnw verify (Flyway seed + seed-id-match + JWT + users/teams + health/log/cors)
        working-directory: services/spring-svc
        run: ./mvnw -B verify

  docker-build:
    name: docker build (multi-stage — conventions/01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (codegen snapshot users.yaml nằm trong context)
        run: docker build -t spring-svc:ci services/spring-svc

  boot-smoke:
    name: boot-smoke (up + health + login + 401-from-service)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-smoke-secret-placeholder-not-real-32chars
    steps:
      - uses: actions/checkout@v4
      - name: Boot postgres + auth-svc + gateway + spring-svc (compose thật, init script chạy)
        run: |
          docker compose -f platform/docker-compose.yml --env-file platform/.env.example \
            up -d --build postgres auth-svc gateway spring-svc
      - name: Smoke — naked /healthz + /readyz (Flyway + seed xong) theo conventions/02
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/readyz >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8081/healthz | grep -q '"status":"ok"'
          curl -sf http://localhost:8081/readyz | grep -q '"status":"ok"'
      - name: Smoke — api-docs phục vụ + chứa FINAL paths (swagger acceptance, host-port)
        run: |
          curl -sf http://localhost:8081/v3/api-docs | grep -q '/api/users/users'
          curl -sf http://localhost:8081/v3/api-docs | grep -q '/api/users/teams'
      - name: Login auth-svc qua gateway → GET fixture user (seed id khớp token sub)
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"alice@demo.local","password":"demo-password"}' | jq -r '.accessToken')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -sf http://localhost:8080/api/users/users/11111111-1111-4111-8111-111111111111 \
            -H "Authorization: Bearer $TOKEN" | jq -e '.email == "alice@demo.local"'
      - name: 401 TỪ SERVICE — direct :8081 bypass gateway presence-check (acceptance sf-3)
        run: |
          no_token=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/users/users/11111111-1111-4111-8111-111111111111)
          echo "no-token → $no_token"; test "$no_token" = "401"
          garbage=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer garbage" http://localhost:8081/api/users/users/11111111-1111-4111-8111-111111111111)
          echo "garbage-token → $garbage"; test "$garbage" = "401"

  drift-guard:
    name: drift-guard — snapshot users.yaml bit-identical contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: diff snapshot vs contract (lệch = fail)
        run: |
          diff contracts/openapi/users.yaml services/spring-svc/src/main/resources/openapi/users.yaml \
            || { echo "::error::snapshot lệch contracts — copy lại (README ADR #2)"; exit 1; }
