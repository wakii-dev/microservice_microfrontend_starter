# Remote `tasks` static — port cố định 4001 trong container (conventions/05, gateway /remotes/tasks/)
server {
  listen 4001;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers baseline — CSP cho MF để SF-7 thiết kế (script-src origin shell)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # remoteEntry.js — shell fetch mỗi lần boot; KHÔNG cache aggressive (deploy mới phải thấy ngay)
  location = /remoteEntry.js {
    add_header Cache-Control "no-cache";
  }

  # Static asset — contenthash nên cache được lâu
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Standalone debug index (index.html) — không router nên fallback đơn giản
  location / {
    try_files $uri $uri/ /index.html;
  }
}
