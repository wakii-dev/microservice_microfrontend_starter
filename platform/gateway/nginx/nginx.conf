# ============================================================================
# nginx gateway — routing theo platform/conventions/08-gateway-and-remotes.md
# SF-1 sở hữu (FI-64). Services chỉ đọc, KHÔNG sửa.
#
# Design decisions:
# - Pass-through: proxy_pass KHÔNG có URI part → path giữ nguyên; service mount
#   đúng prefix /api/<svc> (khớp servers.url trong contracts/openapi/*.yaml).
#   Ngoại lệ /remotes/<name>/*: strip prefix trước khi forward (static remote
#   serve ở root — xem conventions/08).
# - Lazy DNS: upstream đặt qua biến + resolver 127.0.0.11 (Docker DNS) —
#   gateway KHÔNG crash-loop khi upstream chưa tồn tại (stage đầu chỉ có
#   postgres/auth/gateway sống; shell + 3 services vào sau).
# - JWT presence check CHỈ trên /api/tasks|users|activity — signature verify
#   là việc của service (contracts/auth/token-contract.md §4).
# ============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 2m;

    # Docker embedded DNS — resolve upstream lúc request (không lúc config load)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Request id: echo của client hoặc sinh mới ($request_id builtin) — conventions/03
    map $http_x_request_id $req_id {
        ""      $request_id;
        default $http_x_request_id;
    }

    # Remote registry (prod mode): path /remotes/<name>/* → container remote.
    # default rơi về shell — remote name lạ sẽ nhận 404 từ shell thay vì 500 gateway.
    map $uri $remote_up {
        ~^/remotes/tasks/    "http://remote-tasks:4001";
        ~^/remotes/activity/ "http://remote-activity:4002";
        default              "http://shell:3000";
    }

    server {
        listen 8080;
        server_name _;

        # ---------- API: tasks → node-svc (presence check 401) ----------
        location = /api/tasks {
            if ($http_authorization = "") { return 401; }
            set $up http://node-svc:3001;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }
        location /api/tasks/ {
            if ($http_authorization = "") { return 401; }
            set $up http://node-svc:3001;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }

        # ---------- API: users → spring-svc ----------
        location = /api/users {
            if ($http_authorization = "") { return 401; }
            set $up http://spring-svc:8081;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }
        location /api/users/ {
            if ($http_authorization = "") { return 401; }
            set $up http://spring-svc:8081;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }

        # ---------- API: activity → go-svc ----------
        location = /api/activity {
            if ($http_authorization = "") { return 401; }
            set $up http://go-svc:8082;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }
        location /api/activity/ {
            if ($http_authorization = "") { return 401; }
            set $up http://go-svc:8082;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }

        # ---------- API: auth → auth-svc (MỞ — entry login + register + refresh) ----------
        location /api/auth {
            set $up http://auth-svc:8090;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }

        # ---------- 401 body theo error envelope chung (conventions/04) ----------
        error_page 401 = @unauthorized;
        location @unauthorized {
            default_type application/json;
            add_header X-Request-Id $req_id always;
            return 401 '{"error":{"code":"UNAUTHORIZED","message":"Missing Authorization header","requestId":null,"details":null}}';
        }

        # ---------- FE: remote static (SF-6) — strip prefix, forward root ----------
        location /remotes/ {
            # map $uri là LAZY-evaluated: phải nạp $remote_up vào $up TRƯỚC khi
            # rewrite strip prefix. Tính map sau rewrite thì $uri đã thành
            # "/remoteEntry.js" → mọi remote rơi default shell → nhận index.html
            # của shell thay vì JS (MF load fail — bug gặp fresh-clone 2026-10-13).
            set $up $remote_up;
            rewrite ^/remotes/[a-z-]+(/.*)?$ $1 break;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }

        # ---------- FE: shell MF host (SF-5) — 502 đến khi shell tồn tại ----------
        location / {
            set $up http://shell:3000;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $req_id;
        }
    }
}
