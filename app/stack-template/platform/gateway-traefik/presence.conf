# auth-presence — forwardAuth target: tái hiện ĐÚNG logic JWT presence của
# nginx gateway (chỉ kiểm header tồn tại + trả error envelope 401 theo
# conventions/04). Signature verify vẫn là việc service (token-contract §4).
server {
    listen 8081;
    location /check {
        if ($http_authorization = "") {
            return 401 '{"error":{"code":"UNAUTHORIZED","message":"Missing Authorization header","requestId":null,"details":null}}';
        }
        return 200;
    }
}
