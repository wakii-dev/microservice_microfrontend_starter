<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="140" viewBox="0 0 960 140" role="img" aria-label="Activity feed — events pop in at the top one after another next to a pulsing live dot, older rows fade below">
  <title>Activity feed — Kafka realtime</title>
  <desc>A live green dot pulses next to the header while three event rows cycle at the top slot, each popping in with a small slide and a colored accent bar — task created, task assigned, assignment failed to the DLQ — above two older faded rows.</desc>
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101319"/><stop offset="1" stop-color="#171b25"/>
    </linearGradient>
    <clipPath id="fpClip"><rect x="1.5" y="1.5" width="957" height="137" rx="12"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="957" height="137" rx="12" fill="url(#bgD)" stroke="#2a3040" stroke-width="1.5"/>

  <!-- header + live dot pulse -->
  <text x="24" y="30" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e8eaf0">activity feed</text>
  <circle cx="122" cy="26" r="4" fill="#52c41a"/>
  <circle cx="122" cy="26" r="4" fill="none" stroke="#52c41a" stroke-width="1.5">
    <animate attributeName="r" values="4;12" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="936" y="30" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#9aa4b8">kafka · task-events · realtime</text>

  <!-- slot 1: 3 nội dung xoay vòng, pop-in mỗi lượt (loop 4.5s) -->
  <g clip-path="url(#fpClip)">
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.07;0.30;0.34" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.02;0.09;1" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      <rect x="20" y="42" width="3" height="28" rx="1.5" fill="#4096ff"/>
      <rect x="28" y="42" width="912" height="28" rx="8" fill="#1d2434" stroke="#2a3040"/>
      <circle cx="46" cy="56" r="3.5" fill="#4096ff"/>
      <text x="58" y="60" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e8eaf0">task.created — WK-2043</text>
      <text x="928" y="60" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#52c41a">just now</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.07;0.30;0.34" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.02;0.09;1" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/>
      <rect x="20" y="42" width="3" height="28" rx="1.5" fill="#faad14"/>
      <rect x="28" y="42" width="912" height="28" rx="8" fill="#1d2434" stroke="#2a3040"/>
      <circle cx="46" cy="56" r="3.5" fill="#faad14"/>
      <text x="58" y="60" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e8eaf0">task.assigned — WK-2043</text>
      <text x="928" y="60" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#52c41a">just now</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.07;0.30;0.34" dur="4.5s" begin="-3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 7;0 7;0 0;0 0" keyTimes="0;0.02;0.09;1" dur="4.5s" begin="-3s" repeatCount="indefinite"/>
      <rect x="20" y="42" width="3" height="28" rx="1.5" fill="#ff4d4f"/>
      <rect x="28" y="42" width="912" height="28" rx="8" fill="#1d2434" stroke="#2a3040"/>
      <circle cx="46" cy="56" r="3.5" fill="#ff4d4f"/>
      <text x="58" y="60" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#e8eaf0">assignment_failed → saga → DLQ</text>
      <text x="928" y="60" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#ff4d4f">rollback</text>
    </g>
  </g>

  <!-- 2 row cũ mờ dần -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5">
    <rect x="28" y="76" width="912" height="24" rx="8" fill="#171b25" stroke="#232a3a"/>
    <circle cx="46" cy="88" r="3" fill="#4096ff" opacity="0.6"/>
    <text x="58" y="92" fill="#9aa4b8">task.created — WK-2042</text>
    <text x="928" y="92" text-anchor="end" fill="#5a6270">14s ago</text>

    <rect x="28" y="106" width="912" height="24" rx="8" fill="#171b25" stroke="#232a3a"/>
    <circle cx="46" cy="118" r="3" fill="#52c41a" opacity="0.5"/>
    <text x="58" y="122" fill="#6b7386">task.updated — WK-2041</text>
    <text x="928" y="122" text-anchor="end" fill="#5a6270">1m ago</text>
  </g>
</svg>
