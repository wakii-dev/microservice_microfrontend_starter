name: remotes-tasks

# SF-6 (FI-74) — remote `tasks`: typecheck + vitest + rspack build + boot-smoke
# (docker build + up + HTTP 200 + fetch được remoteEntry.js — spec slice mục 6).
# Lưu ý: job chạy trên pnpm-lock.yaml của NHÁNH — nếu SF-5 đang regenerate song song, lockfile
# stale là việc coordinator resolve khi merge, KHÔNG phải bug code (P2 plan-critic note).
on:
  push:
    branches: ["**"]
    paths:
      - "frontend/remotes/tasks/**"
      - "frontend/shared/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/remotes-tasks.yml"
  pull_request:
    paths:
      - "frontend/remotes/tasks/**"
      - "frontend/shared/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/remotes-tasks.yml"

jobs:
  build-test:
    name: typecheck + vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (workspace, frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @boilerplate/remote-tasks typecheck
      - name: Tests (vitest + testing-library)
        run: pnpm --filter @boilerplate/remote-tasks test
      - name: Build (rspack production)
        run: pnpm --filter @boilerplate/remote-tasks build
      - uses: actions/upload-artifact@v4
        with:
          name: remote-tasks-dist
          path: frontend/remotes/tasks/dist/
          retention-days: 3

  boot-smoke:
    name: boot-smoke (docker build + up + 200 + remoteEntry)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (multi-stage node→nginx, context = repo root)
        run: docker build -f frontend/remotes/tasks/Dockerfile -t boilerplate-remote-tasks .
      - name: Up container
        run: docker run -d --name remote-tasks -p 4001:4001 boilerplate-remote-tasks
      - name: Smoke — HTTP 200 trên / (standalone index)
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null -w "%{http_code}" http://localhost:4001/ | grep -q 200; then
              echo "boot-smoke OK (HTTP 200)"; exit 0
            fi
            sleep 2
          done
          echo "boot-smoke FAILED — remote tasks không trả 200 sau 48s"; docker logs remote-tasks; exit 1
      - name: Smoke — fetch được remoteEntry.js (spec slice mục 6)
        run: |
          code=$(curl -fsS -o /tmp/remoteEntry.js -w "%{http_code}" http://localhost:4001/remoteEntry.js)
          [ "$code" = "200" ] || { echo "remoteEntry fetch FAILED ($code)"; exit 1; }
          grep -q "tasks" /tmp/remoteEntry.js || { echo "remoteEntry không chứa MF name 'tasks'"; exit 1; }
          echo "remoteEntry.js OK (HTTP 200 + MF name 'tasks')"
      - name: Smoke — publicPath prod bakes /remotes/tasks/ (conventions/08)
        run: |
          grep -q "/remotes/tasks/" /tmp/remoteEntry.js || { echo "publicPath prod thiếu /remotes/tasks/"; exit 1; }
          echo "publicPath OK (/remotes/tasks/)"
