<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Kanban board demo — a card drags itself from todo to doing to done, the destination column highlights on arrival and the count badges update">
  <title>Kanban — drag đổi status (framer-motion vibe)</title>
  <desc>Three columns todo, doing and done. One card animates across the board: it glides into doing, the column lights up and its badge counts 3; then it glides into done, that column lights and its badge counts 3; the card fades and the loop replays.</desc>
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101319"/><stop offset="1" stop-color="#171b25"/>
    </linearGradient>
    <clipPath id="kbClip"><rect x="1.5" y="1.5" width="637" height="297" rx="14"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="637" height="297" rx="14" fill="url(#bgD)" stroke="#2a3040" stroke-width="1.5"/>

  <!-- ═══ cột TO DO ═══ -->
  <rect x="24" y="44" width="184" height="232" rx="12" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
  <text x="38" y="68" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9aa4b8">TO DO</text>
  <circle cx="182" cy="64" r="10" fill="#232b3d" stroke="#2a3040"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e8eaf0" text-anchor="middle">
    <text x="182" y="68" opacity="1">3<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.15;0.17;0.96;0.98" dur="6s" repeatCount="indefinite"/></text>
    <text x="182" y="68" opacity="0">2<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.17;0.55;0.57;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="182" y="68" opacity="0">1<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.94;0.96;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <g>
    <rect x="32" y="82" width="168" height="40" rx="8" fill="#1d2434" stroke="#2a3040"/>
    <circle cx="46" cy="102" r="3.5" fill="#faad14"/>
    <text x="56" y="106" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d2e4">wire landing hero</text>
  </g>
  <g>
    <rect x="32" y="130" width="168" height="40" rx="8" fill="#1d2434" stroke="#2a3040"/>
    <circle cx="46" cy="150" r="3.5" fill="#ff4d4f"/>
    <text x="56" y="154" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d2e4">add DLQ alert</text>
  </g>

  <!-- ═══ cột DOING ═══ -->
  <rect x="224" y="44" width="184" height="232" rx="12" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
  <rect x="224" y="44" width="184" height="232" rx="12" fill="none" stroke="#4096ff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.14;0.18;0.50;0.56;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="238" y="68" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9aa4b8">DOING</text>
  <circle cx="382" cy="64" r="10" fill="#232b3d" stroke="#2a3040"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e8eaf0" text-anchor="middle">
    <text x="382" y="68" opacity="1">2<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.15;0.17;0.55;0.57;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="382" y="68" opacity="0">3<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.17;0.55;0.57;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <g>
    <rect x="232" y="130" width="168" height="40" rx="8" fill="#1d2434" stroke="#2a3040"/>
    <circle cx="246" cy="150" r="3.5" fill="#4096ff"/>
    <text x="256" y="154" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d2e4">gateway JWT presence</text>
  </g>

  <!-- ═══ cột DONE ═══ -->
  <rect x="424" y="44" width="184" height="232" rx="12" fill="#171b25" stroke="#2a3040" stroke-width="1.5"/>
  <rect x="424" y="44" width="184" height="232" rx="12" fill="none" stroke="#52c41a" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.54;0.58;0.82;0.88;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="438" y="68" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9aa4b8">DONE</text>
  <circle cx="582" cy="64" r="10" fill="#232b3d" stroke="#2a3040"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e8eaf0" text-anchor="middle">
    <text x="582" y="68" opacity="1">2<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.55;0.57;0.96;0.98" dur="6s" repeatCount="indefinite"/></text>
    <text x="582" y="68" opacity="0">3<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.94;0.96;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <g>
    <rect x="432" y="130" width="168" height="40" rx="8" fill="#1d2434" stroke="#2a3040"/>
    <circle cx="446" cy="150" r="3.5" fill="#52c41a"/>
    <text x="456" y="154" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d2e4">kafka-init race fix</text>
  </g>
  <g>
    <rect x="432" y="178" width="168" height="40" rx="8" fill="#1d2434" stroke="#2a3040"/>
    <circle cx="446" cy="198" r="3.5" fill="#52c41a"/>
    <text x="456" y="202" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#c9d2e4">scaffold stack</text>
  </g>

  <!-- ═══ card TỰ TRƯỢT: todo slot 3 (32,182) → doing slot 1 (232,82) → done slot 1 (432,82) ═══ -->
  <g>
    <!-- opacity: tắt lúc 0.84–0.98 để nhảy về vị trí đầu mà không thấy -->
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;0.56;0.84;0.87;0.96;0.99" dur="6s" repeatCount="indefinite"/>
    <!-- translate: 2 chặng spline ease + giữ -->
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="0 0; 200 -100; 200 -100; 400 -100; 400 -100; 0 0"
      keyTimes="0;0.16;0.40;0.56;0.85;0.99"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0 0 1 1"
      dur="6s" repeatCount="indefinite"/>
    <!-- nghiêng nhẹ lúc nhấc card -->
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      values="0 116 204; -4 116 204; 0 116 204; 0 116 204; 4 116 204; 0 116 204"
      keyTimes="0;0.08;0.16;0.48;0.56;1" dur="6s" repeatCount="indefinite" additive="sum"/>
    <rect x="32" y="182" width="168" height="44" rx="8" fill="#1e2a44" stroke="#4096ff" stroke-width="1.5"/>
    <circle cx="46" cy="204" r="3.5" fill="#1677ff"/>
    <text x="56" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#e8eaf0">create task: saga</text>
  </g>

  <!-- caption -->
  <text x="320" y="292" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#9aa4b8">drag đổi status — PATCH /tasks/:id → Kafka → activity</text>
</svg>
